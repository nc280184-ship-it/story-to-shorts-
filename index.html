<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story Acting & Voice Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b1120; color: #f8fafc; min-height: 100vh; padding: 14px; }
    .container { max-width: 520px; margin: 0 auto; }
    h1 { font-size: 1.55rem; color: #38bdf8; margin-bottom: 4px; }
    p.sub { color: #94a3b8; font-size: 0.88rem; margin-bottom: 12px; line-height: 1.4; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: block; font-size: 0.82rem; color: #cbd5e1; margin-bottom: 4px; font-weight: 600; }
    select, textarea {
      width: 100%; border-radius: 12px; border: 1px solid #334155;
      background: #1e293b; color: #f8fafc; font-size: 0.95rem; margin-bottom: 10px;
    }
    select { padding: 10px 12px; }
    textarea { height: 120px; padding: 12px; resize: vertical; line-height: 1.5; }

    .btn-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .btn-play {
      flex: 2; padding: 14px; border: none; border-radius: 12px;
      background: #22c55e; color: #052e16; font-weight: 800; font-size: 1rem; cursor: pointer;
    }
    .btn-stop {
      flex: 1; padding: 14px; border: none; border-radius: 12px;
      background: #ef4444; color: #ffffff; font-weight: 700; font-size: 0.95rem; cursor: pointer;
    }

    .stage-wrap {
      display: flex; flex-direction: column; align-items: center; margin-top: 6px;
    }
    canvas#stageCanvas {
      width: 100%; max-width: 330px; aspect-ratio: 9 / 16;
      border-radius: 20px; border: 2px solid #38bdf8; background: #0f172a;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
    }
    .tip {
      margin-top: 10px; font-size: 0.8rem; color: #94a3b8; text-align: center; line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Story Acting & Voice</h1>
    <p class="sub">Story mujab characters, acting, gusso/shanti/emotional voice ane screen par line-by-line text.</p>

    <div class="grid-2">
      <div>
        <label for="langSelect">Language</label>
        <select id="langSelect">
          <option value="hi-IN" selected>Hindi (हिन्दी)</option>
          <option value="gu-IN">Gujarati (ગુજરાતી)</option>
        </select>
      </div>
      <div>
        <label for="genderSelect">Main Voice</label>
        <select id="genderSelect">
          <option value="female" selected>Female</option>
          <option value="male">Male</option>
        </select>
      </div>
    </div>

    <label for="storyBox">તમારી વાર્તા (Story)</label>
    <textarea id="storyBox" placeholder="અહીં વાર્તા લખો... દરેક લાઇન મુજબ પાત્ર, એક્ટિંગ અને અવાજ બદલાશે."></textarea>

    <div class="btn-row">
      <button class="btn-play" id="playBtn" onclick="startStory()">▶ Play Acting & Voice</button>
      <button class="btn-stop" onclick="stopStory()">⏹ Stop</button>
    </div>

    <div class="stage-wrap">
      <canvas id="stageCanvas" width="720" height="1280"></canvas>
      <div class="tip">Video save karva mate phone no Screen Recorder chalu karine ▶ Play dabavo.</div>
    </div>
  </div>

  <script>
    let playing = false;
    let speaking = false;
    let lines = [];
    let currentIdx = 0;
    let currentText = "વાર્તા લખીને Play દબાવો...";
    let currentMood = "calm";      // calm | angry | emotional
    let speakerSide = "left";      // left | right
    let leftRole = "father";
    let rightRole = "child";
    let sceneType = "house";
    let stepTimer = null;
    let runId = 0;

    function analyzeLine(line, idx, gender) {
      const t = line.toLowerCase();

      // Scene detection
      if (t.includes("दुकान") || t.includes("dukan") || t.includes("દુકાન")) sceneType = "shop";
      else if (t.includes("बाहर") || t.includes("गाँव") || t.includes("सड़क") || t.includes("ગામ") || t.includes("બહાર")) sceneType = "outside";
      else sceneType = "house";

      // Mood detection
      const angryKeys = ["गुस्सा", "गुस्से", "चिल्ला", "नफरत", "बकवास", "धमकी", "क्रोध", "मूर्ख", "gusso", "gusse", "chilla", "ગુસ્સો", "ગુસ્સે", "!"];
      const emoKeys = ["प्यार", "त्याग", "बीमार", "आंसू", "रोने", "दिल", "माफ", "दुख", "દુઃખ", "પ્રેમ", "ત્યાગ", "આંસુ", "બીમાર"];

      if (angryKeys.some(k => t.includes(k))) currentMood = "angry";
      else if (emoKeys.some(k => t.includes(k))) currentMood = "emotional";
      else currentMood = "calm";

      // Character role & speaker side
      const hasChild = ["बच्चा", "बेटा", "बेटी", "छोटा", "બાળક", "દીકરો", "દીકરી", "નાનું"].some(k => t.includes(k));
      const hasFather = ["पिता", "पापा", "father", "પિતા", "પપ્પા"].some(k => t.includes(k));
      const hasMother = ["माँ", "माता", "मम्मी", "માતા", "મમ્મી"].some(k => t.includes(k));
      const hasShop = ["दुकान", "दुकानदार", "dukan", "દુકાન"].some(k => t.includes(k));

      if (hasShop) {
        leftRole = "shopkeeper";
        rightRole = hasChild ? "child" : "person";
        speakerSide = hasChild ? "right" : "left";
      } else if (hasChild && (hasFather || hasMother)) {
        leftRole = hasMother ? "mother" : "father";
        rightRole = "child";
        const childSpeaking = ["बेटा बोला", "बेटी बोली", "बच्चा बोला", "દીકરો બોલ્યો", "દીકરી બોલી", "બાળક બોલ્યું"].some(k => t.includes(k));
        speakerSide = childSpeaking ? "right" : (idx % 2 === 1 ? "right" : "left");
      } else if (hasChild) {
        leftRole = gender === "male" ? "father" : "mother";
        rightRole = "child";
        speakerSide = "right";
      } else if (hasFather || hasMother) {
        leftRole = hasMother ? "mother" : "father";
        rightRole = "child";
        speakerSide = "left";
      } else {
        leftRole = gender === "male" ? "father" : "mother";
        rightRole = "friend";
        speakerSide = idx % 2 === 0 ? "left" : "right";
      }
    }

    function getVoiceParams(mood, gender, side) {
      let pitch = gender === "male" ? 0.82 : 1.12;
      let rate = 0.95;

      if (side === "right" && rightRole === "child") {
        pitch = 1.32;
      }

      if (mood === "angry") {
        pitch = Math.min(1.45, pitch + 0.14);
        rate = 1.14;
      } else if (mood === "emotional") {
        pitch = Math.max(0.68, pitch - 0.10);
        rate = 0.84;
      } else {
        rate = 0.90;
      }
      return { pitch, rate };
    }

    function pickVoice(langCode, gender) {
      try {
        if (!("speechSynthesis" in window)) return null;
        const all = window.speechSynthesis.getVoices() || [];
        if (!all.length) return null;
        const prefix = langCode.split("-")[0].toLowerCase();
        const filtered = all.filter(v => v.lang && v.lang.toLowerCase().startsWith(prefix));
        const pool = filtered.length ? filtered : all;

        const fHints = ["female", "woman", "swara", "heera", "lekha", "priya", "neerja", "aditi"];
        const mHints = ["male", "man", "ravi", "prabhat", "hemant", "rahul", "arjun"];
        const hints = gender === "male" ? mHints : fHints;

        const match = pool.find(v => hints.some(h => v.name.toLowerCase().includes(h)));
        if (match) return match;
        if (gender === "male" && pool.length > 1) return pool[1];
        return pool[0];
      } catch (e) {
        return null;
      }
    }

    function splitLines(raw) {
      const parts = raw
        .split(/(?<=[.!?।])\s+|\n+/)
        .map(s => s.trim())
        .filter(Boolean);

      const out = [];
      for (const p of parts) {
        if (p.length <= 85) {
          out.push(p);
        } else {
          const words = p.split(/\s+/);
          let cur = "";
          for (const w of words) {
            const next = cur ? cur + " " + w : w;
            if (next.length > 82 && cur) {
              out.push(cur);
              cur = w;
            } else {
              cur = next;
            }
          }
          if (cur) out.push(cur);
        }
      }
      return out.length ? out : [raw.trim()];
    }

    function roundRect(ctx, x, y, w, h, r) {
      const rad = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rad, y);
      ctx.arcTo(x + w, y, x + w, y + h, rad);
      ctx.arcTo(x + w, y + h, x, y + h, rad);
      ctx.arcTo(x, y + h, x, y, rad);
      ctx.arcTo(x, y, x + w, y, rad);
      ctx.closePath();
    }

    function wrapText(ctx, text, maxW) {
      const words = text.split(/\s+/).filter(Boolean);
      const res = [];
      let line = "";
      for (const w of words) {
        const test = line ? line + " " + w : w;
        if (ctx.measureText(test).width > maxW && line) {
          res.push(line);
          line = w;
        } else {
          line = test;
        }
      }
      if (line) res.push(line);
      return res.slice(0, 4);
    }

    function drawScene(ctx, w, h) {
      if (sceneType === "outside") {
        ctx.fillStyle = currentMood === "angry" ? "#7f1d1d" : "#0284c7";
        ctx.fillRect(0, 0, w, h * 0.65);
        ctx.fillStyle = "#166534";
        ctx.fillRect(0, h * 0.65, w, h * 0.35);
      } else {
        ctx.fillStyle = currentMood === "angry" ? "#450a0a" : (currentMood === "emotional" ? "#1e1b4b" : "#1e293b");
        ctx.fillRect(0, 0, w, h * 0.65);
        ctx.fillStyle = "#334155";
        ctx.fillRect(0, h * 0.65, w, h * 0.35);

        // Window
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(275, 115, 170, 150);
        ctx.strokeStyle = "#cbd5e1";
        ctx.lineWidth = 6;
        ctx.strokeRect(275, 115, 170, 150);
      }

      if (sceneType === "shop") {
        ctx.fillStyle = "#78350f";
        ctx.fillRect(45, 550, w - 90, 170);
      }
    }

    function drawActor(ctx, t, cfg) {
      const { cx, baseY, role, active, mood } = cfg;
      const isChild = role === "child";
      const isFemale = role === "mother";
      const headR = isChild ? 66 : 78;

      const shake = active && mood === "angry" ? Math.sin(t / 32) * 7 : 0;
      const bounce = active ? Math.sin(t / (mood === "angry" ? 85 : 165)) * (mood === "angry" ? 11 : 5) : Math.sin(t / 520) * 2;
      const armMove = active
        ? (mood === "angry" ? Math.sin(t / 90) * 0.65 : (mood === "emotional" ? 0.15 : Math.sin(t / 180) * 0.28))
        : 0.04;

      const x = cx + shake;
      const y = baseY + bounce;

      if (active) {
        ctx.strokeStyle = mood === "angry" ? "#f87171" : (mood === "emotional" ? "#c084fc" : "#38bdf8");
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(x, y, headR + 15, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Body
      const outfit = isChild ? "#f59e0b" : (role === "shopkeeper" ? "#059669" : (isFemale ? "#ec4899" : "#0284c7"));
      ctx.fillStyle = outfit;
      roundRect(ctx, x - 64, y + headR - 10, 128, isChild ? 110 : 145, 32);
      ctx.fill();

      // Arms
      ctx.save();
      ctx.translate(x - 64, y + headR + 12);
      ctx.rotate(-0.55 + armMove);
      ctx.fillStyle = "#fdba74";
      roundRect(ctx, -16, 0, 32, 92, 15);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.translate(x + 64, y + headR + 12);
      ctx.rotate(0.45 - armMove);
      ctx.fillStyle = "#fdba74";
      roundRect(ctx, -16, 0, 32, 92, 15);
      ctx.fill();
      ctx.restore();

      // Head
      ctx.fillStyle = "#fed7aa";
      ctx.beginPath();
      ctx.arc(x, y, headR, 0, Math.PI * 2);
      ctx.fill();

      // Hair
      ctx.fillStyle = "#1e1b4b";
      ctx.beginPath();
      ctx.arc(x, y - 12, headR + 2, Math.PI * 1.05, Math.PI * 1.95);
      ctx.fill();
      if (isFemale) {
        roundRect(ctx, x - headR - 4, y - 14, 24, 92, 12);
        ctx.fill();
        roundRect(ctx, x + headR - 20, y - 14, 24, 92, 12);
        ctx.fill();
      }

      // Eyebrows (Acting expressions)
      ctx.strokeStyle = "#1e1b4b";
      ctx.lineWidth = 5.5;
      ctx.lineCap = "round";
      ctx.beginPath();
      if (active && mood === "angry") {
        ctx.moveTo(x - 42, y - 28);
        ctx.lineTo(x - 14, y - 12);
        ctx.moveTo(x + 42, y - 28);
        ctx.lineTo(x + 14, y - 12);
      } else if (active && mood === "emotional") {
        ctx.moveTo(x - 42, y - 16);
        ctx.lineTo(x - 14, y - 26);
        ctx.moveTo(x + 42, y - 16);
        ctx.lineTo(x + 14, y - 26);
      } else {
        ctx.moveTo(x - 40, y - 20);
        ctx.lineTo(x - 16, y - 20);
        ctx.moveTo(x + 40, y - 20);
        ctx.lineTo(x + 16, y - 20);
      }
      ctx.stroke();

      // Eyes
      ctx.fillStyle = "#0f172a";
      ctx.beginPath();
      ctx.arc(x - 27, y - 8, isChild ? 10 : 9, 0, Math.PI * 2);
      ctx.arc(x + 27, y - 8, isChild ? 10 : 9, 0, Math.PI * 2);
      ctx.fill();

      // Tear drop when emotional
      if (active && mood === "emotional") {
        ctx.fillStyle = "#38bdf8";
        ctx.beginPath();
        ctx.arc(x - 32, y + 10, 5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Mouth
      const mouthH = active ? 6 + Math.abs(Math.sin(t / (mood === "angry" ? 75 : 120))) * 17 : 4;
      ctx.fillStyle = "#991b1b";
      ctx.beginPath();
      ctx.ellipse(x, y + 30, 17, mouthH, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function renderLoop(t) {
      const canvas = document.getElementById("stageCanvas");
      const ctx = canvas.getContext("2d");
      const w = canvas.width;
      const h = canvas.height;

      drawScene(ctx, w, h);

      drawActor(ctx, t, {
        cx: 210,
        baseY: 420,
        role: leftRole,
        active: speaking && speakerSide === "left",
        mood: currentMood
      });

      drawActor(ctx, t, {
        cx: 510,
        baseY: rightRole === "child" ? 455 : 420,
        role: rightRole,
        active: speaking && speakerSide === "right",
        mood: currentMood
      });

      // Subtitle box
      const accent = currentMood === "angry" ? "#f87171" : (currentMood === "emotional" ? "#c084fc" : "#38bdf8");
      ctx.fillStyle = "rgba(15, 23, 42, 0.92)";
      roundRect(ctx, 36, 760, w - 72, 430, 26);
      ctx.fill();
      ctx.strokeStyle = accent;
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = accent;
      ctx.font = "bold 23px system-ui, sans-serif";
      ctx.textAlign = "center";
      const activeActor = (speakerSide === "left" ? leftRole : rightRole).toUpperCase();
      const header = playing
        ? `LINE ${currentIdx + 1}/${lines.length} • ${activeActor} • ${currentMood.toUpperCase()}`
        : "READY";
      ctx.fillText(header, w / 2, 815);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 38px system-ui, sans-serif";
      const wrapped = wrapText(ctx, currentText, w - 120);
      wrapped.forEach((l, i) => {
        ctx.fillText(l, w / 2, 895 + i * 56);
      });

      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    function stopStory() {
      runId++;
      playing = false;
      speaking = false;
      if (stepTimer) {
        clearTimeout(stepTimer);
        stepTimer = null;
      }
      try {
        if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      } catch (e) {}
      document.getElementById("playBtn").textContent = "▶ Play Acting & Voice";
    }

    function playLine(idx, token) {
      if (!playing || token !== runId) return;

      if (idx >= lines.length) {
        playing = false;
        speaking = false;
        currentText = "વાર્તા પૂર્ણ
