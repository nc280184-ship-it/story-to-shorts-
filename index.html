<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story Acting & Voice Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #090d16; color: #f8fafc; min-height: 100vh; padding: 14px; }
    .container { max-width: 540px; margin: 0 auto; }
    h1 { font-size: 1.55rem; color: #38bdf8; margin-bottom: 4px; }
    p.sub { color: #94a3b8; font-size: 0.88rem; margin-bottom: 12px; line-height: 1.4; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: block; font-size: 0.82rem; color: #cbd5e1; margin-bottom: 4px; font-weight: 600; }
    select, textarea {
      width: 100%; border-radius: 12px; border: 1px solid #334155;
      background: #1e293b; color: #f8fafc; font-size: 0.95rem; margin-bottom: 10px;
    }
    select { padding: 10px 12px; }
    textarea { height: 125px; padding: 12px; resize: vertical; line-height: 1.5; }

    .btn-row { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; margin-bottom: 8px; }
    .nav-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .btn-play {
      padding: 13px; border: none; border-radius: 12px;
      background: #22c55e; color: #052e16; font-weight: 800; font-size: 0.98rem; cursor: pointer;
    }
    .btn-stop {
      padding: 13px; border: none; border-radius: 12px;
      background: #ef4444; color: #ffffff; font-weight: 700; font-size: 0.92rem; cursor: pointer;
    }
    .btn-step {
      padding: 10px; border: 1px solid #334155; border-radius: 10px;
      background: #111827; color: #e2e8f0; font-weight: 700; font-size: 0.85rem; cursor: pointer;
    }

    .stage-wrap { display: flex; flex-direction: column; align-items: center; margin-top: 4px; }
    canvas#stageCanvas {
      width: 100%; max-width: 330px; aspect-ratio: 9 / 16;
      border-radius: 20px; border: 2px solid #38bdf8; background: #0f172a;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.6);
    }
    .status-bar {
      margin-top: 8px; font-size: 0.82rem; color: #cbd5e1; text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Story Acting & Voice Studio</h1>
    <p class="sub">Je line jene bolvani hoy ej character bole ane ej acting kare — gusso, shanti ane emotional voice sathe.</p>

    <div class="grid-2">
      <div>
        <label for="langSelect">Language</label>
        <select id="langSelect">
          <option value="hi-IN" selected>Hindi (हिन्दी)</option>
          <option value="gu-IN">Gujarati (ગુજરાતી)</option>
        </select>
      </div>
      <div>
        <label for="genderSelect">Main Voice</label>
        <select id="genderSelect">
          <option value="female" selected>Female</option>
          <option value="male">Male</option>
        </select>
      </div>
    </div>

    <label for="storyBox">તમારી વાર્તા (Story)</label>
    <textarea id="storyBox" placeholder="જેમ કે:&#10;पिता गुस्से में बोले: तुमने आज काम क्यों नहीं किया?&#10;बेटा शांति से बोला: पापा, माफ़ कर दीजिए, आगे से ध्यान रखूँगा।"></textarea>

    <div class="btn-row">
      <button class="btn-play" id="playBtn" onclick="startStory()">▶ Play Acting & Voice</button>
      <button class="btn-stop" onclick="stopStory()">⏹ Stop</button>
    </div>

    <div class="nav-row">
      <button class="btn-step" onclick="jumpLine(-1)">⬅ Previous Line</button>
      <button class="btn-step" onclick="jumpLine(1)">Next Line ➡</button>
    </div>

    <div class="stage-wrap">
      <canvas id="stageCanvas" width="720" height="1280"></canvas>
      <div class="status-bar" id="statusBar">Ready — વાર્તા લખીને Play દબાવો</div>
    </div>
  </div>

  <script>
    let playing = false;
    let speaking = false;
    let lines = [];
    let currentIdx = 0;
    let currentText = "વાર્તા લખીને Play દબાવો...";
    let currentMood = "calm";      // calm | angry | emotional
    let speakerSide = "left";      // left | right
    let activeSpeakerRole = "father";
    let leftRole = "father";
    let rightRole = "child";
    let sceneType = "house";
    let stepTimer = null;
    let runId = 0;

    function setStatus(msg) {
      const el = document.getElementById("statusBar");
      if (el) el.textContent = msg;
    }

    function detectRoleFromText(str) {
      const s = str.toLowerCase();
      if (["बच्चा", "बेटा", "बेटी", "छोटा", "बालक", "બાળક", "દીકરો", "દીકરી", "નાનું", "child", "son", "daughter"].some(k => s.includes(k))) {
        return "child";
      }
      if (["माँ", "माता", "मम्मी", "માતા", "મમ્મી", "mother", "mom"].some(k => s.includes(k))) {
        return "mother";
      }
      if (["दुकानदार", "दुकान", "dukan", "દુકાન", "shopkeeper"].some(k => s.includes(k))) {
        return "shopkeeper";
      }
      if (["पिता", "पापा", "पप्पा", "પિતા", "પપ્પા", "father", "dad"].some(k => s.includes(k))) {
        return "father";
      }
      return null;
    }

    function analyzeLine(line, idx, gender) {
      const t = line.toLowerCase();

      // Scene detection
      if (t.includes("दुकान") || t.includes("dukan") || t.includes("દુકાન")) sceneType = "shop";
      else if (t.includes("बाहर") || t.includes("गाँव") || t.includes("सड़क") || t.includes("ગામ") || t.includes("બહાર")) sceneType = "outside";
      else sceneType = "house";

      // Mood detection (gusso / emotional / calm)
      const angryKeys = ["गुस्सा", "गुस्से", "चिल्ला", "नफरत", "बकवास", "धमकी", "क्रोध", "मूर्ख", "gusso", "gusse", "chilla", "ગુસ્સો", "ગુસ્સે", "!"];
      const emoKeys = ["प्यार", "त्याग", "बीमार", "आंसू", "रोने", "दिल", "माफ", "माफ़", "दुख", "દુઃખ", "પ્રેમ", "ત્યાગ", "આંસુ", "બીમાર"];

      if (angryKeys.some(k => t.includes(k))) currentMood = "angry";
      else if (emoKeys.some(k => t.includes(k))) currentMood = "emotional";
      else currentMood = "calm";

      // Check explicit prefix like "Father: ..." or "Beta: ..."
      const colonIdx = line.indexOf(":");
      let explicitSpeaker = null;
      if (colonIdx > 0 && colonIdx < 35) {
        const prefixPart = line.slice(0, colonIdx);
        explicitSpeaker = detectRoleFromText(prefixPart);
      }

      // Otherwise check who is speaking in the line
      let detectedSpeaker = explicitSpeaker;
      if (!detectedSpeaker) {
        const speakPatterns = [
          /(?:पिता|पापा|पप्पा|પિતા|પપ્પા)\s*(?:गुस्से में|शांति से|प्यार से|रोते हुए)?\s*(?:बोले|बोला|कहा|कहते|બોલ્યા|બોલ્યો|કહ્યું)/i,
          /(?:माँ|माता|मम्मी|માતા|મમ્મી)\s*(?:गुस्से में|शांति से|प्यार से|रोते हुए)?\s*(?:बोली|कहा|कहती|બોલ્યા|બોલી|કહ્યું)/i,
          /(?:बच्चा|बेटा|बेटी|बालक|બાળક|દીકરો|દીકરી)\s*(?:गुस्से में|शांति से|प्यार से|रोते हुए)?\s*(?:बोला|बोली|कहा|બોલ્યો|બોલી|કહ્યું)/i,
          /(?:दुकानदार|દુકાનદાર)\s*(?:बोला|बोली|कहा|બોલ્યો|બોલી|કહ્યું)/i
        ];
        for (const pat of speakPatterns) {
          if (pat.test(line)) {
            detectedSpeaker = detectRoleFromText(line.match(pat)[0]);
            break;
          }
        }
      }

      if (!detectedSpeaker) {
        detectedSpeaker = detectRoleFromText(line);
      }

      if (!detectedSpeaker) {
        detectedSpeaker = idx % 2 === 0 ? (gender === "male" ? "father" : "mother") : "child";
      }

      activeSpeakerRole = detectedSpeaker;

      // Place speaker on right if child/buyer, or left if adult/father/mother/shopkeeper
      if (detectedSpeaker === "child") {
        rightRole = "child";
        if (leftRole === "child") leftRole = gender === "male" ? "father" : "mother";
        speakerSide = "right";
      } else {
        leftRole = detectedSpeaker;
        if (rightRole === leftRole) rightRole = "child";
        speakerSide = "left";
      }
    }

    function getVoiceParams(mood, gender, role) {
      let pitch = gender === "male" ? 0.82 : 1.12;
      let rate = 0.92;

      if (role === "child") {
        pitch = 1.34;
      } else if (role === "father" || role === "shopkeeper") {
        pitch = 0.78;
      } else if (role === "mother") {
        pitch = 1.15;
      }

      if (mood === "angry") {
        pitch = Math.min(1.45, pitch + 0.14);
        rate = 1.14;
      } else if (mood === "emotional") {
        pitch = Math.max(0.68, pitch - 0.10);
        rate = 0.84;
      } else {
        rate = 0.90;
      }
      return { pitch, rate };
    }

    function pickVoice(langCode, gender) {
      try {
        if (!("speechSynthesis" in window)) return null;
        const all = window.speechSynthesis.getVoices() || [];
        if (!all.length) return null;
        const prefix = langCode.split("-")[0].toLowerCase();
        const filtered = all.filter(v => v.lang && v.lang.toLowerCase().startsWith(prefix));
        const pool = filtered.length ? filtered : all;

        const fHints = ["female", "woman", "swara", "heera", "lekha", "priya", "neerja", "aditi"];
        const mHints = ["male", "man", "ravi", "prabhat", "hemant", "rahul", "arjun"];
        const hints = gender === "male" ? mHints : fHints;

        const match = pool.find(v => hints.some(h => v.name.toLowerCase().includes(h)));
        if (match) return match;
        if (gender === "male" && pool.length > 1) return pool[1];
        return pool[0];
      } catch (e) {
        return null;
      }
    }

    function splitLines(raw) {
      const parts = raw
        .split(/(?<=[.!?।])\s+|\n+/)
        .map(s => s.trim())
        .filter(Boolean);

      const out = [];
      for (const p of parts) {
        if (p.length <= 85) {
          out.push(p);
        } else {
          const words = p.split(/\s+/);
          let cur = "";
          for (const w of words) {
            const next = cur ? cur + " " + w : w;
            if (next.length > 82 && cur) {
              out.push(cur);
              cur = w;
            } else {
              cur = next;
            }
          }
          if (cur) out.push(cur);
        }
      }
      return out.length ? out : [raw.trim()];
    }

    function roundRect(ctx, x, y, w, h, r) {
      const rad = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rad, y);
      ctx.arcTo(x + w, y, x + w, y + h, rad);
      ctx.arcTo(x + w, y + h, x, y + h, rad);
      ctx.arcTo(x, y + h, x, y, rad);
      ctx.arcTo(x, y, x + w, y, rad);
      ctx.closePath();
    }

    function wrapText(ctx, text, maxW) {
      const words = text.split(/\s+/).filter(Boolean);
      const res = [];
      let line = "";
      for (const w of words) {
        const test = line ? line + " " + w : w;
        if (ctx.measureText(test).width > maxW && line) {
          res.push(line);
          line = w;
        } else {
          line = test;
        }
      }
      if (line) res.push(line);
      return res.slice(0, 4);
    }

    function drawScene(ctx, w, h) {
      if (sceneType === "outside") {
        ctx.fillStyle = currentMood === "angry" ? "#7f1d1d" : "#0284c7";
        ctx.fillRect(0, 0, w, h * 0.65);
        ctx.fillStyle = "#166534";
        ctx.fillRect(0, h * 0.65, w, h * 0.35);
      } else {
        ctx.fillStyle = currentMood === "angry" ? "#450a0a" : (currentMood === "emotional" ? "#1e1b4b" : "#1e293b");
        ctx.fillRect(0, 0, w, h * 0.65);
        ctx.fillStyle = "#334155";
        ctx.fillRect(0, h * 0.65, w, h * 0.35);

        ctx.fillStyle = "#0f172a";
        ctx.fillRect(275, 115, 170, 150);
        ctx.strokeStyle = "#cbd5e1";
        ctx.lineWidth = 6;
        ctx.strokeRect(275, 115, 170, 150);
      }

      if (sceneType === "shop") {
        ctx.fillStyle = "#78350f";
        ctx.fillRect(45, 550, w - 90, 170);
      }
    }

    function drawActor(ctx, t, cfg) {
      const { cx, baseY, role, active, mood } = cfg;
      const isChild = role === "child";
      const isFemale = role === "mother";
      const headR = isChild ? 66 : 78;

      // Only the active speaking character performs acting/movement
      const shake = active && mood === "angry" ? Math.sin(t / 32) * 7 : 0;
      const bounce = active ? Math.sin(t / (mood === "angry" ? 85 : 165)) * (mood === "angry" ? 11 : 5) : 0;
      const armMove = active
        ? (mood === "angry" ? Math.sin(t / 90) * 0.65 : (mood === "emotional" ? 0.15 : Math.sin(t / 180) * 0.28))
        : 0.04;

      const x = cx + shake;
      const y = baseY + bounce;

      if (active) {
        ctx.strokeStyle = mood === "angry" ? "#f87171" : (mood === "emotional" ? "#c084fc" : "#38bdf8");
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(x, y, headR + 15, 0, Math.PI * 2);
        ctx.stroke();
      }

      const outfit = isChild ? "#f59e0b" : (role === "shopkeeper" ? "#059669" : (isFemale ? "#ec4899" : "#0284c7"));
      ctx.fillStyle = outfit;
      roundRect(ctx, x - 64, y + headR - 10, 128, isChild ? 110 : 145, 32);
      ctx.fill();

      ctx.save();
      ctx.translate(x - 64, y + headR + 12);
      ctx.rotate(-0.55 + armMove);
      ctx.fillStyle = "#fdba74";
      roundRect(ctx, -16, 0, 32, 92, 15);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.translate(x + 64, y + headR + 12);
      ctx.rotate(0.45 - armMove);
      ctx.fillStyle = "#fdba74";
      roundRect(ctx, -16, 0, 32, 92, 15);
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = "#fed7aa";
      ctx.beginPath();
      ctx.arc(x, y, headR, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#1e1b4b";
      ctx.beginPath();
      ctx.arc(x, y - 12, headR + 2, Math.PI * 1.05, Math.PI * 1.95);
      ctx.fill();
      if (isFemale) {
        roundRect(ctx, x - headR - 4, y - 14, 24, 92, 12);
        ctx.fill();
        roundRect(ctx, x + headR - 20, y - 14, 24, 92, 12);
        ctx.fill();
      }

      ctx.strokeStyle = "#1e1b4b";
      ctx.lineWidth = 5.5;
      ctx.lineCap = "round";
      ctx.beginPath();
      if (active && mood === "angry") {
        ctx.moveTo(x - 42, y - 28);
        ctx.lineTo(x - 14, y - 12);
        ctx.moveTo(x + 42, y - 28);
        ctx.lineTo(x + 14, y - 12);
      } else if (active && mood === "emotional") {
        ctx.moveTo(x - 42, y - 16);
        ctx.lineTo(x - 14, y - 26);
        ctx.moveTo(x + 42, y - 16);
        ctx.lineTo(x + 14, y - 26);
      } else {
        ctx.moveTo(x - 40, y - 20);
        ctx.lineTo(x - 16, y - 20);
        ctx.moveTo(x + 40, y - 20);
        ctx.lineTo(x + 16, y - 20);
      }
      ctx.stroke();

      ctx.fillStyle = "#0f172a";
      ctx.beginPath();
      ctx.arc(x - 27, y - 8, isChild ? 10 : 9, 0, Math.PI * 2);
      ctx.arc(x + 27, y - 8, isChild ? 10 : 9, 0, Math.PI * 2);
      ctx.fill();

      if (active && mood === "emotional") {
        ctx.fillStyle = "#38bdf8";
        ctx.beginPath();
        ctx.arc(x - 32, y + 10, 5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Mouth moves only for the character speaking this line
      const mouthH = active ? 6 + Math.abs(Math.sin(t / (mood === "angry" ? 75 : 120))) * 17 : 4;
      ctx.fillStyle = "#991b1b";
      ctx.beginPath();
      ctx.ellipse(x, y + 30, 17, mouthH, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function renderLoop(t) {
      const canvas = document.getElementById("stageCanvas");
      const ctx = canvas.getContext("2d");
      const w = canvas.width;
      const h = canvas.height;

      drawScene(ctx, w, h);

      drawActor(ctx, t, {
        cx: 210,
        baseY: 420,
        role: leftRole,
        active: speaking && speakerSide === "left",
        mood: currentMood
      });

      drawActor(ctx, t, {
        cx: 510,
        baseY: rightRole === "child" ? 455 : 420,
        role: rightRole,
        active: speaking && speakerSide === "right",
        mood: currentMood
      });

      const accent = currentMood === "angry" ? "#f87171" : (currentMood === "emotional" ? "#c084fc" : "#38bdf8");
      ctx.fillStyle = "rgba(15, 23, 42, 0.92)";
      roundRect(ctx, 36, 760, w - 72, 430, 26);
      ctx.fill();
      ctx.strokeStyle = accent;
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = accent;
      ctx.font = "bold 23px system-ui, sans-serif";
      ctx.textAlign = "center";
      const header = playing
        ? `LINE ${currentIdx + 1}/${lines.length} • ${activeSpeakerRole.toUpperCase()} • ${currentMood.toUpperCase()}`
        : "READY";
      ctx.fillText(header, w / 2, 815);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 38px system-ui, sans-serif";
      const wrapped = wrapText(ctx, currentText, w - 120);
      wrapped.forEach((l, i) => {
        ctx.fillText(l, w / 2, 895 + i * 56);
      });

      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    function stopStory() {
      runId++;
      playing = false;
      speaking = false;
      if (stepTimer) {
        clearTimeout(stepTimer);
        stepTimer = null;
      }
      try {
        if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      } catch (e) {}
      document.getElementById("playBtn").textContent = "▶ Play Acting & Voice";
      setStatus("Stopped");
    }

    function playLine(idx, token) {
      if (!playing || token !== runId) return;

      if (idx >= lines.length) {
        playing = false;
        speaking = false;
        currentText = "વાર્તા પૂર્ણ થઈ!";
        document.getElementById("playBtn").textContent = "▶ Play Again";
        setStatus("Completed all lines");
        return;
      }

      currentIdx = idx;
      currentText = lines[idx];
      const lang = document.getElementById("langSelect").value;
      const gender = document.getElementById("genderSelect").value;

      analyzeLine(currentText, idx, gender);
      const voiceCfg = getVoiceParams(currentMood, gender, activeSpeakerRole);
      speaking = true;
      setStatus(`Line ${idx + 1}/${lines.length} • Speaker: ${activeSpeakerRole.toUpperCase()} • ${currentMood.toUpperCase()}`);

      let advanced = false;
      const advance = () => {
        if (advanced || !playing || token !== runId) return;
        advanced = true;
        if (stepTimer) {
          clearTimeout(stepTimer);
          stepTimer = null;
        }
        speaking = false;
        playLine(idx + 1, token);
      };

      const safeDuration = Math.max(2500, currentText.length * 120) + 1200;
      stepTimer = setTimeout(advance, safeDuration);

      try {
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(currentText);
          u.lang = lang;
          u.pitch = voiceCfg.pitch;
          u.rate = voiceCfg.rate;
          const v = pickVoice(lang, gender);
          if (v) u.voice = v;

          u.onend = advance;
          u.onerror = advance;
          window.speechSynthesis.speak(u);
        }
      } catch (e) {}
    }

    function startStory() {
      const raw = document.getElementById("storyBox").value.trim();
      if (!raw) {
        alert("કૃપા કરીને પહેલા વાર્તા લખો.");
        return;
      }

      stopStory();
      const token = ++runId;
      lines = splitLines(raw);
      playing = true;
      document.getElementById("playBtn").textContent = "Playing...";
      playLine(0, token);
    }

    function jumpLine(delta) {
      const raw = document.getElementById("storyBox").value.trim();
      if (!raw) return;
      if (!lines.length) lines = splitLines(raw);
      const target = Math.max(0, Math.min(lines.length - 1, currentIdx + delta));
      stopStory();
      const token = ++runId;
      playing = true;
      document.getElementById("playBtn").textContent = "Playing...";
      playLine(target, token);
    }
  </script>
</body>
</html>
