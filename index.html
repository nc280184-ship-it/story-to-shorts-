<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Cartoon Story Video Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b1120; color: #f8fafc; min-height: 100vh; padding: 16px; }
    .container { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.7rem; color: #38bdf8; margin-bottom: 6px; }
    p.sub { color: #94a3b8; font-size: 0.9rem; margin-bottom: 14px; line-height: 1.45; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: block; font-size: 0.84rem; color: #cbd5e1; margin-bottom: 5px; font-weight: 600; }
    select, textarea {
      width: 100%; border-radius: 12px; border: 1px solid #334155;
      background: #1e293b; color: #f8fafc; font-size: 0.96rem; margin-bottom: 12px;
    }
    select { padding: 11px 12px; }
    textarea { height: 135px; padding: 13px; resize: vertical; line-height: 1.5; }

    .btn-gen {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: #22c55e; color: #052e16; font-weight: 800; font-size: 1rem;
      cursor: pointer; margin-bottom: 10px;
    }
    .btn-stop {
      width: 100%; padding: 10px; border: none; border-radius: 10px;
      background: #ef4444; color: #ffffff; font-weight: 700; font-size: 0.9rem;
      cursor: pointer; margin-bottom: 12px;
    }

    .info-box {
      background: #111827; border: 1px solid #334155; border-radius: 12px;
      padding: 10px 12px; font-size: 0.82rem; color: #cbd5e1; margin-bottom: 14px; line-height: 1.45;
    }

    .stage-wrap {
      display: none; flex-direction: column; align-items: center; margin-top: 10px;
    }
    canvas#cartoonCanvas {
      width: 100%; max-width: 310px; aspect-ratio: 9 / 16;
      border-radius: 20px; border: 2px solid #38bdf8; background: #0f172a;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.55);
    }
    #downloadBtn {
      display: none; margin-top: 12px; padding: 12px 18px; border-radius: 12px;
      background: #38bdf8; color: #0f172a; font-weight: 800; text-decoration: none;
      font-size: 0.95rem; text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Cartoon Video Generator</h1>
    <p class="sub">Story mujab character (Father, Child, Shop/Person) ane gusso/shanti acting sathe line-by-line video.</p>

    <div class="grid-2">
      <div>
        <label for="langOption">1. Language</label>
        <select id="langOption" onchange="updateVoiceInfo()">
          <option value="hi-IN" selected>Hindi (हिन्दी)</option>
          <option value="gu-IN">Gujarati (ગુજરાતી)</option>
        </select>
      </div>

      <div>
        <label for="voiceGender">2. Voice</label>
        <select id="voiceGender" onchange="updateVoiceInfo()">
          <option value="female" selected>Female Voice</option>
          <option value="male">Male Voice</option>
        </select>
      </div>
    </div>

    <label for="storyText">Story / Text</label>
    <textarea id="storyText" placeholder="અહીં વાર્તા લખો... દરેક લાઇન મુજબ પાત્ર અને ગુસ્સો/શાંતિ બદલાશે."></textarea>

    <button class="btn-gen" id="genVideoBtn" onclick="generateCartoonVideo()">3. Generate Video</button>
    <button class="btn-stop" onclick="stopCartoonVideo()">Stop / Reset</button>

    <div class="info-box" id="voiceInfo">Voice check thai rahyu che...</div>

    <div class="stage-wrap" id="stageWrap">
      <canvas id="cartoonCanvas" width="720" height="1280"></canvas>
      <a id="downloadBtn" download="cartoon-story.webm">⬇ Download Video</a>
    </div>
  </div>

  <script>
    let isRunning = false;
    let isSpeaking = false;
    let mediaRecorder = null;
    let chunks = [];
    let animFrame = null;
    let linesQueue = [];
    let activeLineIdx = 0;
    let activeLineText = "";
    let activeMood = "calm";
    let activeRole = "adult";
    let fallbackTimer = null;

    function detectRoleFromLine(line, gender) {
      const t = line.toLowerCase();
      if (t.includes("बच्चा") || t.includes("बेटा") || t.includes("बेटी") || t.includes("छोटा") || t.includes("बालक") || t.includes("બાળક") || t.includes("દીકરો") || t.includes("દીકરી") || t.includes("નાનું")) {
        return "child";
      }
      if (t.includes("पिता") || t.includes("पापा") || t.includes("father") || t.includes("पप्पा") || t.includes("પિતા")) {
        return "father";
      }
      if (t.includes("दुकान") || t.includes("दुकानदार") || t.includes("dukan") || t.includes("દુકાન")) {
        return "shopkeeper";
      }
      return gender === "male" ? "father" : "adult";
    }

    function detectMoodFromLine(line) {
      const t = line.toLowerCase();
      const angryWords = [
        "गुस्सा", "गुस्से", "चिल्ला", "नफरत", "बकवास", "धमकी", "क्रोध", "मूर्ख", "हट",
        "gusso", "gusse", "chilla", "nafrat", "krodh", "murkh", "!"
      ];
      if (angryWords.some(w => t.includes(w)) || line.includes("!")) {
        return "angry";
      }
      return "calm";
    }

    function getMoodSettings(mood, gender) {
      const isMale = gender === "male";
      if (mood === "angry") {
        return {
          pitch: isMale ? 1.02 : 1.32,
          rate: 1.15
        };
      }
      return {
        pitch: isMale ? 0.72 : 1.02,
        rate: 0.85
      };
    }

    function pickBestVoice(langCode, gender) {
      if (!("speechSynthesis" in window)) return null;
      const voices = window.speechSynthesis.getVoices() || [];
      const prefix = langCode.split("-")[0].toLowerCase();
      const langVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(prefix));
      const pool = langVoices.length ? langVoices : voices;
      if (!pool.length) return null;

      const femaleHints = ["female", "woman", "girl", "heera", "swara", "lekha", "priya", "neerja", "aditi", "google हिन्दी", "google ગુજરાતી"];
      const maleHints = ["male", "man", "boy", "ravi", "prabhat", "hemant", "rahul", "arjun", "aarav"];

      const hints = gender === "male" ? maleHints : femaleHints;
      const matched = pool.find(v => hints.some(h => v.name.toLowerCase().includes(h)));
      if (matched) return matched;

      if (gender === "male" && pool.length > 1) return pool[1];
      return pool[0];
    }

    function updateVoiceInfo() {
      const lang = document.getElementById("langOption").value;
      const gender = document.getElementById("voiceGender").value;
      const v = pickBestVoice(lang, gender);
      const vName = v ? `${v.name} (${v.lang})` : "Default System Voice";
      document.getElementById("voiceInfo").textContent =
        `Voice: ${vName} | Dynamic Role + Gusso/Shanti Action + Screen Sync: ON`;
    }

    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = updateVoiceInfo;
    }
    updateVoiceInfo();

    function splitIntoLines(rawText) {
      const rawLines = rawText
        .split(/(?<=[.!?।])\s+|\n+/)
        .map(s => s.trim())
        .filter(Boolean);

      const result = [];
      for (const line of rawLines) {
        if (line.length <= 85) {
          result.push(line);
        } else {
          const words = line.split(/\s+/);
          let cur = "";
          for (const w of words) {
            const next = cur ? cur + " " + w : w;
            if (next.length > 82 && cur) {
              result.push(cur);
              cur = w;
            } else {
              cur = next;
            }
          }
          if (cur) result.push(cur);
        }
      }
      return result.length ? result : [rawText.trim()];
    }

    function wrapCanvasText(ctx, text, maxWidth) {
      const words = text.trim().split(/\s+/).filter(Boolean);
      const lines = [];
      let cur = "";
      for (const w of words) {
        const test = cur ? cur + " " + w : w;
        if (ctx.measureText(test).width > maxWidth && cur) {
          lines.push(cur);
          cur = w;
        } else {
          cur = test;
        }
      }
      if (cur) lines.push(cur);
      return lines.slice(0, 4);
    }

    function drawCartoonScene(t) {
      const canvas = document.getElementById("cartoonCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const w = canvas.width;
      const h = canvas.height;
      const gender = document.getElementById("voiceGender").value;

      const isAngry = activeMood === "angry";
      const isChild = activeRole === "child";
      const isShop = activeRole === "shopkeeper";

      const topColor = isAngry ? "#7f1d1d" : (isShop ? "#14532d" : "#1e3a8a");
      const accentColor = isAngry ? "#f87171" : (isShop ? "#4ade80" : "#38bdf8");

      const bg = ctx.createLinearGradient(0, 0, 0, h);
      bg.addColorStop(0, topColor);
      bg.addColorStop(0.64, "#0f172a");
      bg.addColorStop(0.64, "#1e293b");
      bg.addColorStop(1, "#090d16");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      // Counter/table when shopkeeper role is active
      if (isShop) {
        ctx.fillStyle = "#451a03";
        ctx.fillRect(60, 560, w - 120, 185);
        ctx.fillStyle = "#78350f";
        ctx.fillRect(50, 545, w - 100, 24);
      }

      const shakeX = isAngry && isSpeaking ? Math.sin(t / 30) * 8 : 0;
      const bob = isSpeaking ? Math.sin(t / (isAngry ? 80 : 165)) * (isAngry ? 13 : 6) : Math.sin(t / 500) * 3;
      const armAction = isSpeaking
        ? (isAngry ? Math.sin(t / 90) * 0.65 : Math.sin(t / 180) * 0.25)
        : 0.06;

      const headRadius = isChild ? 92 : 105;
      const cx = w / 2 + shakeX;
      const cy = (isChild ? 455 : 420) + bob;

      // Body
      const bodyColor = isChild ? "#f59e0b" : (activeRole === "father" ? "#0284c7" : (isShop ? "#059669" : "#ec4899"));
      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.roundRect(cx - 88, cy + headRadius - 15, 176, isChild ? 145 : 185, 42);
      ctx.fill();

      // Left arm (acting/gesturing)
      ctx.save();
      ctx.translate(cx - 88, cy + headRadius + 15);
      ctx.rotate(-0.55 + armAction);
      ctx.fillStyle = "#fdba74";
      ctx.beginPath();
      ctx.roundRect(-22, 0, 42, 120, 20);
      ctx.fill();
      ctx.restore();

      // Right arm
      ctx.save();
      ctx.translate(cx + 88, cy + headRadius + 15);
      ctx.rotate(0.45 - armAction);
      ctx.fillStyle = "#fdba74";
      ctx.beginPath();
      ctx.roundRect(-20, 0, 42, 120, 20);
      ctx.fill();
      ctx.restore();

      // Head
      ctx.fillStyle = "#fed7aa";
      ctx.beginPath();
      ctx.arc(cx, cy, headRadius, 0, Math.PI * 2);
      ctx.fill();

      // Hair / Cap
      ctx.fillStyle = "#1e1b4b";
      ctx.beginPath();
      ctx.arc(cx, cy - 16, headRadius + 3, Math.PI * 1.05, Math.PI * 1.95);
      ctx.fill();

      if (isShop) {
        ctx.fillStyle = "#eab308";
        ctx.beginPath();
        ctx.roundRect(cx - 95, cy - headRadius - 12, 190, 26, 12);
        ctx.fill();
      } else if (!isChild && gender === "female") {
        ctx.beginPath();
        ctx.roundRect(cx - headRadius - 6, cy - 18, 34, 125, 16);
        ctx.roundRect(cx + headRadius - 28, cy - 18, 34, 125, 16);
        ctx.fill();
      }

      // Eyebrows (angry vs calm acting)
      ctx.strokeStyle = "#1e1b4b";
      ctx.lineWidth = 7;
      ctx.lineCap = "round";
      if (isAngry) {
        ctx.beginPath();
        ctx.moveTo(cx - 56, cy - 34);
        ctx.lineTo(cx - 20, cy - 16);
        ctx.moveTo(cx + 56, cy - 34);
        ctx.lineTo(cx + 20, cy - 16);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.moveTo(cx - 54, cy - 26);
        ctx.lineTo(cx - 22, cy - 26);
        ctx.moveTo(cx + 54, cy - 26);
        ctx.lineTo(cx + 22, cy - 26);
        ctx.stroke();
      }

      // Eyes
      const blink = Math.sin(t / 950) > 0.96;
      ctx.fillStyle = "#0f172a";
      if (blink) {
        ctx.fillRect(cx - 50, cy - 10, 24, 5);
        ctx.fillRect(cx + 26, cy - 10, 24, 5);
      } else {
        ctx.beginPath();
        ctx.arc(cx - 36, cy - 10, isChild ? 14 : 12, 0, Math.PI * 2);
        ctx.arc(cx + 36, cy - 10, isChild ? 14 : 12, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(cx - 40, cy - 14, 5, 0, Math.PI * 2);
        ctx.arc(cx + 32, cy - 14, 5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Mouth
      const mouthRadiusY = isSpeaking ? 7 + Math.abs(Math.sin(t / (isAngry ? 75 : 120))) * 22 : 5;
      ctx.fillStyle = "#991b1b";
      ctx.beginPath();
      ctx.ellipse(cx, cy + 40, 22, mouthRadiusY, 0, 0, Math.PI * 2);
      ctx.fill();

      // Active line caption box
      ctx.fillStyle = "rgba(15, 23, 42, 0.92)";
      ctx.beginPath();
      ctx.roundRect(38, 765, w - 76, 420, 28);
      ctx.fill();

      ctx.strokeStyle = accentColor;
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = accentColor;
      ctx.font = "bold 24px system-ui, sans-serif";
      ctx.textAlign = "center";
      const moodLabel = isAngry ? "GUSSO" : "SHANTI";
      const badgeText = isRunning
        ? `LINE ${activeLineIdx + 1}/${linesQueue.length} • ${activeRole.toUpperCase()} • ${moodLabel}`
        : "DONE";
      ctx.fillText(badgeText, w / 2, 818);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 40px system-ui, sans-serif";
      const lines = wrapCanvasText(ctx, activeLineText || "", w - 120);
      const startY = 895;
      lines.forEach((l, i) => {
        ctx.fillText(l, w / 2, startY + i * 58);
      });
    }

    function startRenderLoop() {
      if (animFrame) cancelAnimationFrame(animFrame);
      const loop = (t) => {
        drawCartoonScene(t);
        animFrame = requestAnimationFrame(loop);
      };
      animFrame = requestAnimationFrame(loop);
    }

    function stopCartoonVideo() {
      isRunning = false;
      isSpeaking = false;
      activeLineText = "";
      if (fallbackTimer) {
        clearTimeout(fallbackTimer);
        fallbackTimer = null;
      }
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
      }
      document.getElementById("genVideoBtn").textContent = "3. Generate Video";
      drawCartoonScene(performance.now());
    }

    function speakLine(idx) {
      if (!isRunning) return;

      if (idx >= linesQueue.length) {
        isRunning = false;
        isSpeaking = false;
        activeLineText = "";
        document.getElementById("genVideoBtn").textContent = "3. Generate Video";
        setTimeout(() => {
          if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
          }
        }, 400);
        return;
      }

      activeLineIdx = idx;
      activeLineText = linesQueue[idx];
      const lang = document.getElementById("langOption").value;
      const gender = document.getElementById("voiceGender").value;
      activeRole = detectRoleFromLine(activeLineText, gender);
      activeMood = detectMoodFromLine(activeLineText);
      const settings = getMoodSettings(activeMood, gender);

      if (!("speechSynthesis" in window)) {
        isSpeaking = true;
        fallbackTimer = setTimeout(() => {
          isSpeaking = false;
          speakLine(idx + 1);
        }, 2400);
        return;
      }

      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(activeLineText);
      utter.lang = lang;
      utter.pitch = settings.pitch;
      utter.rate = settings.rate;

      const chosen = pickBestVoice(lang, gender);
      if (chosen) utter.voice = chosen;

      isSpeaking = true;

      const estDuration = Math.max(2200, activeLineText.length * 110) + 1200;
      fallbackTimer = setTimeout(() => {
        if (!isRunning) return;
        isSpeaking = false;
        speakLine(idx + 1);
      }, estDuration);

      utter.onend = () => {
        if (fallbackTimer) {
          clearTimeout(fallbackTimer);
          fallbackTimer = null;
        }
        if (!isRunning) return;
        isSpeaking = false;
        speakLine(idx + 1);
      };

      utter.onerror = () => {
        if (fallbackTimer) {
          clearTimeout(fallbackTimer);
          fallbackTimer = null;
        }
        if (!isRunning) return;
        isSpeaking = false;
        speakLine(idx + 1);
      };

      window.speechSynthesis.speak(utter);
    }

    function generateCartoonVideo() {
      const raw = document.getElementById("storyText").value.trim();
      if (!raw) {
        alert("કૃપા કરીને પહેલા Story / Text લખો.");
        return;
      }

      stopCartoonVideo();
      linesQueue = splitIntoLines(raw);
      activeLineIdx = 0;
      activeLineText = linesQueue[0];
      const gender = document.getElementById("voiceGender").value;
      activeRole = detectRoleFromLine(activeLineText, gender);
      activeMood = detectMoodFromLine(activeLineText);
      isRunning = true;

      document.getElementById("stageWrap").style.display = "flex";
      document.getElementById("downloadBtn").style.display = "none";
      document.getElementById("genVideoBtn").textContent = "Playing & Recording... (Tap Stop)";
      startRenderLoop();

      const canvas = document.getElementById("cartoonCanvas");
      if (canvas.captureStream && typeof MediaRecorder !== "undefined") {
        chunks = [];
        const stream = canvas.captureStream(30);
        const types = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm", "video/mp4"];
        const mime = types.find(m => MediaRecorder.isTypeSupported(m)) || "";

        try {
          mediaRecorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
          mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) chunks.push(e.data);
          };
          mediaRecorder.onstop = () => {
            if (!chunks.length) return;
            const blob = new Blob(chunks, { type: mime || "video/webm" });
            const url = URL.createObjectURL(blob);
            const dl = document.getElementById("downloadBtn");
            dl.href = url;
            dl.download = mime.includes("mp4") ? "cartoon-story.mp4" : "cartoon-story.webm";
            dl.style.display = "inline-block";
          };
          mediaRecorder.start();
        } catch (err) {
          // Recording fallback without crash
        }
      }

      speakLine(0);
    }
  </script>
</body>
</html>
