<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Cartoon Story Video Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b1120; color: #f8fafc; min-height: 100vh; padding: 16px; }
    .container { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.7rem; color: #38bdf8; margin-bottom: 6px; }
    p.sub { color: #94a3b8; font-size: 0.9rem; margin-bottom: 14px; line-height: 1.45; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: block; font-size: 0.84rem; color: #cbd5e1; margin-bottom: 5px; font-weight: 600; }
    select, textarea {
      width: 100%; border-radius: 12px; border: 1px solid #334155;
      background: #1e293b; color: #f8fafc; font-size: 0.96rem; margin-bottom: 12px;
    }
    select { padding: 11px 12px; }
    textarea { height: 135px; padding: 13px; resize: vertical; line-height: 1.5; }

    .btn-gen {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: #22c55e; color: #052e16; font-weight: 800; font-size: 1rem;
      cursor: pointer; margin-bottom: 10px;
    }
    .btn-stop {
      width: 100%; padding: 10px; border: none; border-radius: 10px;
      background: #ef4444; color: #ffffff; font-weight: 700; font-size: 0.9rem;
      cursor: pointer; margin-bottom: 12px;
    }

    .info-box {
      background: #111827; border: 1px solid #334155; border-radius: 12px;
      padding: 10px 12px; font-size: 0.82rem; color: #cbd5e1; margin-bottom: 14px; line-height: 1.45;
    }

    .stage-wrap {
      display: none; flex-direction: column; align-items: center; margin-top: 10px;
    }
    canvas#cartoonCanvas {
      width: 100%; max-width: 310px; aspect-ratio: 9 / 16;
      border-radius: 20px; border: 2px solid #38bdf8; background: #0f172a;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.55);
    }
    #downloadBtn {
      display: none; margin-top: 12px; padding: 12px 18px; border-radius: 12px;
      background: #38bdf8; color: #0f172a; font-weight: 800; text-decoration: none;
      font-size: 0.95rem; text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Cartoon Video Generator</h1>
    <p class="sub">Story mujab multiple characters aavshe, vat karshe ane acting karshe — je line bole te j screen par dekhashe.</p>

    <div class="grid-2">
      <div>
        <label for="langOption">1. Language</label>
        <select id="langOption" onchange="updateVoiceInfo()">
          <option value="hi-IN" selected>Hindi (हिन्दी)</option>
          <option value="gu-IN">Gujarati (ગુજરાતી)</option>
        </select>
      </div>

      <div>
        <label for="voiceGender">2. Voice</label>
        <select id="voiceGender" onchange="updateVoiceInfo()">
          <option value="female" selected>Female Voice</option>
          <option value="male">Male Voice</option>
        </select>
      </div>
    </div>

    <label for="storyText">Story / Text</label>
    <textarea id="storyText" placeholder="અહીં વાર્તા લખો... પિતા, બાળક, દુકાનદાર, ગુસ્સો કે શાંતિ મુજબ પાત્ર અને એક્ટિંગ બદલાશે."></textarea>

    <button class="btn-gen" id="genVideoBtn" onclick="generateCartoonVideo()">3. Generate Video</button>
    <button class="btn-stop" onclick="stopCartoonVideo()">Stop / Reset</button>

    <div class="info-box" id="voiceInfo">Voice check thai rahyu che...</div>

    <div class="stage-wrap" id="stageWrap">
      <canvas id="cartoonCanvas" width="720" height="1280"></canvas>
      <a id="downloadBtn" download="cartoon-story.webm">⬇ Download Video</a>
    </div>
  </div>

  <script>
    let isRunning = false;
    let isSpeaking = false;
    let mediaRecorder = null;
    let chunks = [];
    let animFrame = null;
    let linesQueue = [];
    let activeLineIdx = 0;
    let activeLineText = "";
    let activeMood = "calm";
    let speakerSide = "left"; // "left" or "right"
    let leftRole = "father";
    let rightRole = "child";
    let activeScene = "house";
    let fallbackTimer = null;

    function detectScene(line) {
      const t = line.toLowerCase();
      if (t.includes("दुकान") || t.includes("dukan") || t.includes("દુકાન")) return "shop";
      if (t.includes("बाहर") || t.includes("सड़क") || t.includes("गाँव") || t.includes("bahar") || t.includes("ગામ")) return "outside";
      return "house";
    }

    function detectCastForLine(line, idx, gender) {
      const t = line.toLowerCase();
      const hasChild = t.includes("बच्चा") || t.includes("बेटा") || t.includes("बेटी") || t.includes("छोटा") || t.includes("बालक") || t.includes("બાળક") || t.includes("દીકરો") || t.includes("દીકરી") || t.includes("નાનું");
      const hasFather = t.includes("पिता") || t.includes("पापा") || t.includes("father") || t.includes("પિતા");
      const hasShop = t.includes("दुकान") || t.includes("दुकानदार") || t.includes("dukan") || t.includes("દુકાન");

      if (hasShop) {
        leftRole = "shopkeeper";
        rightRole = hasChild ? "child" : "buyer";
        speakerSide = hasChild ? "right" : "left";
      } else if (hasChild && hasFather) {
        leftRole = "father";
        rightRole = "child";
        speakerSide = t.includes("बेटा") || t.includes("बेटी") || t.includes("બાળક") || t.includes("દીકરી") ? "right" : "left";
      } else if (hasChild) {
        leftRole = gender === "male" ? "father" : "adult";
        rightRole = "child";
        speakerSide = "right";
      } else if (hasFather) {
        leftRole = "father";
        rightRole = "child";
        speakerSide = "left";
      } else {
        leftRole = gender === "male" ? "father" : "adult";
        rightRole = "friend";
        speakerSide = idx % 2 === 0 ? "left" : "right";
      }
    }

    function detectMood(line) {
      const t = line.toLowerCase();
      const angryWords = [
        "गुस्सा", "गुस्से", "चिल्ला", "नफरत", "बकवास", "धमकी", "क्रोध", "मूर्ख", "हट",
        "gusso", "gusse", "chilla", "nafrat", "krodh", "murkh", "!"
      ];
      return (angryWords.some(w => t.includes(w)) || line.includes("!")) ? "angry" : "calm";
    }

    function getMoodSettings(mood, gender, side) {
      const isMale = gender === "male";
      const sideOffset = side === "right" ? 0.08 : -0.04;
      if (mood === "angry") {
        return {
          pitch: Math.max(0.65, Math.min(1.45, (isMale ? 1.02 : 1.32) + sideOffset)),
          rate: 1.15
        };
      }
      return {
        pitch: Math.max(0.6, Math.min(1.3, (isMale ? 0.72 : 1.02) + sideOffset)),
        rate: 0.85
      };
    }

    function pickBestVoice(langCode, gender) {
      if (!("speechSynthesis" in window)) return null;
      const voices = window.speechSynthesis.getVoices() || [];
      const prefix = langCode.split("-")[0].toLowerCase();
      const langVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(prefix));
      const pool = langVoices.length ? langVoices : voices;
      if (!pool.length) return null;

      const femaleHints = ["female", "woman", "girl", "heera", "swara", "lekha", "priya", "neerja", "aditi", "google हिन्दी", "google ગુજરાતી"];
      const maleHints = ["male", "man", "boy", "ravi", "prabhat", "hemant", "rahul", "arjun", "aarav"];

      const hints = gender === "male" ? maleHints : femaleHints;
      const matched = pool.find(v => hints.some(h => v.name.toLowerCase().includes(h)));
      if (matched) return matched;

      if (gender === "male" && pool.length > 1) return pool[1];
      return pool[0];
    }

    function updateVoiceInfo() {
      const lang = document.getElementById("langOption").value;
      const gender = document.getElementById("voiceGender").value;
      const v = pickBestVoice(lang, gender);
      const vName = v ? `${v.name} (${v.lang})` : "Default System Voice";
      document.getElementById("voiceInfo").textContent =
        `Voice: ${vName} | Multi-Character Acting + Gusso/Shanti + Line Sync`;
    }

    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = updateVoiceInfo;
    }
    updateVoiceInfo();

    function splitIntoLines(rawText) {
      const rawLines = rawText
        .split(/(?<=[.!?।])\s+|\n+/)
        .map(s => s.trim())
        .filter(Boolean);

      const result = [];
      for (const line of rawLines) {
        if (line.length <= 85) {
          result.push(line);
        } else {
          const words = line.split(/\s+/);
          let cur = "";
          for (const w of words) {
            const next = cur ? cur + " " + w : w;
            if (next.length > 82 && cur) {
              result.push(cur);
              cur = w;
            } else {
              cur = next;
            }
          }
          if (cur) result.push(cur);
        }
      }
      return result.length ? result : [rawText.trim()];
    }

    function wrapCanvasText(ctx, text, maxWidth) {
      const words = text.trim().split(/\s+/).filter(Boolean);
      const lines = [];
      let cur = "";
      for (const w of words) {
        const test = cur ? cur + " " + w : w;
        if (ctx.measureText(test).width > maxWidth && cur) {
          lines.push(cur);
          cur = w;
        } else {
          cur = test;
        }
      }
      if (cur) lines.push(cur);
      return lines.slice(0, 4);
    }

    function drawBackground(ctx, w, h, isAngry) {
      if (activeScene === "outside") {
        const sky = ctx.createLinearGradient(0, 0, 0, h * 0.65);
        sky.addColorStop(0, isAngry ? "#7f1d1d" : "#0284c7");
        sky.addColorStop(1, isAngry ? "#450a0a" : "#bae6fd");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, h * 0.65);

        ctx.fillStyle = "#166534";
        ctx.fillRect(0, h * 0.65, w, h * 0.35);
      } else {
        ctx.fillStyle = isAngry ? "#450a0a" : "#1e293b";
        ctx.fillRect(0, 0, w, h * 0.66);

        ctx.fillStyle = "#334155";
        ctx.fillRect(0, h * 0.66, w, h * 0.34);

        ctx.fillStyle = "#0f172a";
        ctx.fillRect(275, 130, 170, 160);
        ctx.strokeStyle = "#cbd5e1";
        ctx.lineWidth = 7;
        ctx.strokeRect(275, 130, 170, 160);
      }

      if (activeScene === "shop") {
        ctx.fillStyle = "#451a03";
        ctx.fillRect(50, 565, w - 100, 170);
        ctx.fillStyle = "#78350f";
        ctx.fillRect(40, 550, w - 80, 22);
      }
    }

    function drawCharacter(ctx, t, opts) {
      const { cx, baseY, role, isTalking, isAngry, gender } = opts;
      const isChild = role === "child";
      const isShop = role === "shopkeeper";
      const headR = isChild ? 68 : 78;

      const shakeX = isAngry && isTalking ? Math.sin(t / 32) * 6 : 0;
      const bobY = isTalking ? Math.sin(t / (isAngry ? 85 : 165)) * (isAngry ? 10 : 5) : Math.sin(t / 520) * 2.5;
      const armSwing = isTalking ? (isAngry ? Math.sin(t / 95) * 0.6 : Math.sin(t / 185) * 0.25) : 0.05;

      const x = cx + shakeX;
      const y = baseY + bobY;

      // Active speaker glow ring
      if (isTalking) {
        ctx.strokeStyle = isAngry ? "#f87171" : "#38bdf8";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(x, y,
