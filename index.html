<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Cartoon Story Video Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b1120; color: #f8fafc; min-height: 100vh; padding: 16px; }
    .container { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.7rem; color: #38bdf8; margin-bottom: 6px; }
    p.sub { color: #94a3b8; font-size: 0.9rem; margin-bottom: 14px; line-height: 1.45; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: block; font-size: 0.84rem; color: #cbd5e1; margin-bottom: 5px; font-weight: 600; }
    select, textarea {
      width: 100%; border-radius: 12px; border: 1px solid #334155;
      background: #1e293b; color: #f8fafc; font-size: 0.96rem; margin-bottom: 12px;
    }
    select { padding: 11px 12px; }
    textarea { height: 130px; padding: 13px; resize: vertical; line-height: 1.5; }

    .btn-gen {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: #22c55e; color: #052e16; font-weight: 800; font-size: 1rem;
      cursor: pointer; margin-bottom: 10px;
    }
    .btn-stop {
      width: 100%; padding: 10px; border: none; border-radius: 10px;
      background: #ef4444; color: #ffffff; font-weight: 700; font-size: 0.9rem;
      cursor: pointer; margin-bottom: 12px;
    }

    .info-box {
      background: #111827; border: 1px solid #334155; border-radius: 12px;
      padding: 10px 12px; font-size: 0.82rem; color: #cbd5e1; margin-bottom: 14px; line-height: 1.45;
    }

    .stage-wrap {
      display: none; flex-direction: column; align-items: center; margin-top: 10px;
    }
    canvas#cartoonCanvas {
      width: 100%; max-width: 310px; aspect-ratio: 9 / 16;
      border-radius: 20px; border: 2px solid #38bdf8; background: #0f172a;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.55);
    }
    #downloadBtn {
      display: none; margin-top: 12px; padding: 12px 18px; border-radius: 12px;
      background: #38bdf8; color: #0f172a; font-weight: 800; text-decoration: none;
      font-size: 0.95rem; text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Cartoon Video Generator</h1>
    <p class="sub">Language ane Voice pasand karo, story lakho ane Generate Video dabavi ne cartoon video banavo.</p>

    <div class="grid-2">
      <!-- Option 1: Language -->
      <div>
        <label for="langOption">1. Language</label>
        <select id="langOption" onchange="updateVoiceInfo()">
          <option value="hi-IN" selected>Hindi (हिन्दी)</option>
          <option value="gu-IN">Gujarati (ગુજરાતી)</option>
        </select>
      </div>

      <!-- Option 2: Voice (Female / Male) -->
      <div>
        <label for="voiceGender">2. Voice</label>
        <select id="voiceGender" onchange="updateVoiceInfo()">
          <option value="female" selected>Female Voice</option>
          <option value="male">Male Voice</option>
        </select>
      </div>
    </div>

    <label for="storyText">Story / Text</label>
    <textarea id="storyText" placeholder="અહીં તમારી વાર્તા લખો (Hindi અથવા Gujarati માં)..."></textarea>

    <!-- Option 3: Generate Video -->
    <button class="btn-gen" id="genVideoBtn" onclick="generateCartoonVideo()">3. Generate Video</button>
    <button class="btn-stop" onclick="stopCartoonVideo()">Stop / Reset</button>

    <div class="info-box" id="voiceInfo">Voice check thai rahyu che...</div>

    <div class="stage-wrap" id="stageWrap">
      <canvas id="cartoonCanvas" width="720" height="1280"></canvas>
      <a id="downloadBtn" download="cartoon-story.webm">⬇ Download Video</a>
    </div>
  </div>

  <script>
    let isSpeaking = false;
    let isRecording = false;
    let mediaRecorder = null;
    let chunks = [];
    let animFrame = null;
    let currentLine = "";

    function pickBestVoice(langCode, gender) {
      if (!("speechSynthesis" in window)) return null;
      const voices = window.speechSynthesis.getVoices() || [];
      const prefix = langCode.split("-")[0].toLowerCase();
      const langVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(prefix));
      const pool = langVoices.length ? langVoices : voices;
      if (!pool.length) return null;

      const femaleHints = ["female", "woman", "girl", "heera", "swara", "lekha", "priya", "neerja", "aditi", "google हिन्दी", "google ગુજરાતી"];
      const maleHints = ["male", "man", "boy", "ravi", "prabhat", "hemant", "rahul", "arjun", "aarav"];

      const hints = gender === "male" ? maleHints : femaleHints;
      const matched = pool.find(v => hints.some(h => v.name.toLowerCase().includes(h)));
      if (matched) return matched;

      if (gender === "male" && pool.length > 1) return pool[1];
      return pool[0];
    }

    function updateVoiceInfo() {
      const lang = document.getElementById("langOption").value;
      const gender = document.getElementById("voiceGender").value;
      const v = pickBestVoice(lang, gender);
      const info = document.getElementById("voiceInfo");
      if (!v) {
        info.textContent = "Phone ma voice list nathi mali; default voice thi prayatna thashe.";
        return;
      }
      info.textContent = `Selected: ${gender.toUpperCase()} | Voice: ${v.name} (${v.lang})`;
    }

    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = updateVoiceInfo;
    }
    updateVoiceInfo();

    function wrapLines(ctx, text, maxWidth) {
      const words = text.trim().split(/\s+/).filter(Boolean);
      const lines = [];
      let cur = "";
      for (const w of words) {
        const test = cur ? cur + " " + w : w;
        if (ctx.measureText(test).width > maxWidth && cur) {
          lines.push(cur);
          cur = w;
        } else {
          cur = test;
        }
      }
      if (cur) lines.push(cur);
      return lines.slice(0, 6);
    }

    function drawCartoonScene(t) {
      const canvas = document.getElementById("cartoonCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const w = canvas.width;
      const h = canvas.height;
      const gender = document.getElementById("voiceGender").value;

      // Sky & room background
      const sky = ctx.createLinearGradient(0, 0, 0, h);
      sky.addColorStop(0, "#1e3a8a");
      sky.addColorStop(0.65, "#0f172a");
      sky.addColorStop(0.65, "#1e293b");
      sky.addColorStop(1, "#090d16");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);

      // Soft glowing sun/orb
      ctx.fillStyle = "rgba(250, 204, 21, 0.22)";
      ctx.beginPath();
      ctx.arc(580, 180, 120 + Math.sin(t / 500) * 12, 0, Math.PI * 2);
      ctx.fill();

      const bob = isSpeaking ? Math.sin(t / 120) * 10 : Math.sin(t / 450) * 4;
      const armWave = isSpeaking ? Math.sin(t / 140) * 0.35 : Math.sin(t / 500) * 0.08;
      const cx = w / 2;
      const cy = 440 + bob;

      // Torso / shirt
      ctx.fillStyle = gender === "male" ? "#0284c7" : "#ec4899";
      ctx.beginPath();
      ctx.roundRect(cx - 95, cy + 85, 190, 190, 45);
      ctx.fill();

      // Waving left arm
      ctx.save();
      ctx.translate(cx - 95, cy + 115);
      ctx.rotate(-0.5 + armWave);
      ctx.fillStyle = "#fdba74";
      ctx.beginPath();
      ctx.roundRect(-24, 0, 46, 130, 22);
      ctx.fill();
      ctx.restore();

      // Right arm
      ctx.save();
      ctx.translate(cx + 95, cy + 115);
      ctx.rotate(0.4 - armWave);
      ctx.fillStyle = "#fdba74";
      ctx.beginPath();
      ctx.roundRect(-22, 0, 46, 130, 22);
      ctx.fill();
      ctx.restore();

      // Head
      ctx.fillStyle = "#fed7aa";
      ctx.beginPath();
      ctx.arc(cx, cy, 105, 0, Math.PI * 2);
      ctx.fill();

      // Hair
      ctx.fillStyle = "#1e1b4b";
      ctx.beginPath();
      ctx.arc(cx, cy - 18, 108, Math.PI * 1.05, Math.PI * 1.95);
      ctx.fill();
      if (gender === "female") {
        ctx.beginPath();
        ctx.roundRect(cx - 110, cy - 20, 36, 130, 18);
        ctx.roundRect(cx + 74, cy - 20, 36, 130, 18);
        ctx.fill();
      }

      // Blinking eyes
      const isBlinking = Math.sin(t / 900) > 0.96;
      ctx.fillStyle = "#0f172a";
      if (isBlinking) {
        ctx.fillRect(cx - 52, cy - 12, 26, 5);
        ctx.fillRect(cx + 26, cy - 12, 26, 5);
      } else {
        ctx.beginPath();
        ctx.arc(cx - 38, cy - 12, 13, 0, Math.PI * 2);
        ctx.arc(cx + 38, cy - 12, 13, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(cx - 42, cy - 16, 5, 0, Math.PI * 2);
        ctx.arc(cx + 34, cy - 16, 5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Talking mouth animation
      const mouthOpen = isSpeaking ? 8 + Math.abs(Math.sin(t / 95)) * 22 : 6;
      ctx.fillStyle = "#991b1b";
      ctx.beginPath();
      ctx.ellipse(cx, cy + 42, 24, mouthOpen, 0, 0, Math.PI * 2);
      ctx.fill();

      // Caption box at bottom
      ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
      ctx.beginPath();
      ctx.roundRect(45, 780, w - 90, 390, 28);
      ctx.fill();

      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 36px system-ui, sans-serif";
      ctx.textAlign = "center";
      const textToDraw = currentLine || "તમારી વાર્તા અહીં દેખાશે...";
      const lines = wrapLines(ctx, textToDraw, w - 140);
      const startY = 855;
      lines.forEach((line, idx) => {
        ctx.fillText(line, cx, startY + idx * 52);
      });
    }

    function startRenderLoop() {
      if (animFrame) cancelAnimationFrame(animFrame);
      const step = (t) => {
        drawCartoonScene(t);
        animFrame = requestAnimationFrame(step);
      };
      animFrame = requestAnimationFrame(step);
    }

    function stopCartoonVideo() {
      isSpeaking = false;
      isRecording = false;
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
      }
      document.getElementById("genVideoBtn").textContent = "3. Generate Video";
    }

    function generateCartoonVideo() {
      const text = document.getElementById("storyText").value.trim();
      if (!text) {
        alert("કૃપા કરીને પહેલા Story / Text લખો.");
        return;
      }

      stopCartoonVideo();
      currentLine = text;
      document.getElementById("stageWrap").style.display = "flex";
      document.getElementById("downloadBtn").style.display = "none";
      startRenderLoop();

      const canvas = document.getElementById("cartoonCanvas");
      const canRecord = Boolean(canvas.captureStream && typeof MediaRecorder !== "undefined");

      if (canRecord) {
        chunks = [];
        const stream = canvas.captureStream(30);
        const types = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm", "video/mp4"];
        const mime = types.find(m => MediaRecorder.isTypeSupported(m)) || "";

        try {
          mediaRecorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
          mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) chunks.push(e.data);
          };
          mediaRecorder.onstop = () => {
            isRecording = false;
            isSpeaking = false;
            document.getElementById("genVideoBtn").textContent = "3. Generate Video";
            if (!chunks.length) return;
            const blob = new Blob(chunks, { type: mime || "video/webm" });
            const url = URL.createObjectURL(blob);
            const dl = document.getElementById("downloadBtn");
            dl.href = url;
            dl.download = mime.includes("mp4") ? "cartoon-story.mp4" : "cartoon-story.webm";
            dl.style.display = "inline-block";
          };
          mediaRecorder.start();
          isRecording = true;
          document.getElementById("genVideoBtn").textContent = "Recording... (Tap Stop)";
        } catch (err) {
          isRecording = false;
        }
      }

      if ("speechSynthesis" in window) {
        const lang = document.getElementById("langOption").value;
        const gender = document.getElementById("voiceGender").value;
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = lang;
        utter.pitch = gender === "male" ? 0.82 : 1.18;
        utter.rate = 0.98;
        const chosenVoice = pickBestVoice(lang, gender);
        if (chosenVoice) utter.voice = chosenVoice;

        isSpeaking = true;
        utter.onend = () => {
          isSpeaking = false;
          setTimeout(() => {
            if (mediaRecorder && mediaRecorder.state === "recording") {
              mediaRecorder.stop();
            }
          }, 600);
        };
        utter.onerror = () => {
          isSpeaking = false;
          if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
          }
        };
        window.speechSynthesis.speak(utter);
      } else {
        isSpeaking = true;
        setTimeout(() => {
          isSpeaking = false;
          if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
          }
        }, 6000);
      }
    }
  </script>
</body>
</html>
