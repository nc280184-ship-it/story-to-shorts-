<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Cartoon Story Video Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b1120; color: #f8fafc; min-height: 100vh; padding: 16px; }
    .container { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.7rem; color: #38bdf8; margin-bottom: 6px; }
    p.sub { color: #94a3b8; font-size: 0.9rem; margin-bottom: 14px; line-height: 1.45; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: block; font-size: 0.84rem; color: #cbd5e1; margin-bottom: 5px; font-weight: 600; }
    select, textarea {
      width: 100%; border-radius: 12px; border: 1px solid #334155;
      background: #1e293b; color: #f8fafc; font-size: 0.96rem; margin-bottom: 12px;
    }
    select { padding: 11px 12px; }
    textarea { height: 125px; padding: 13px; resize: vertical; line-height: 1.5; }

    .btn-gen {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: #22c55e; color: #052e16; font-weight: 800; font-size: 1rem;
      cursor: pointer; margin-bottom: 10px;
    }
    .btn-stop {
      width: 100%; padding: 10px; border: none; border-radius: 10px;
      background: #ef4444; color: #ffffff; font-weight: 700; font-size: 0.9rem;
      cursor: pointer; margin-bottom: 12px;
    }

    .info-box {
      background: #111827; border: 1px solid #334155; border-radius: 12px;
      padding: 10px 12px; font-size: 0.82rem; color: #cbd5e1; margin-bottom: 14px; line-height: 1.45;
    }

    .stage-wrap {
      display: none; flex-direction: column; align-items: center; margin-top: 10px;
    }
    canvas#cartoonCanvas {
      width: 100%; max-width: 310px; aspect-ratio: 9 / 16;
      border-radius: 20px; border: 2px solid #38bdf8; background: #0f172a;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.55);
    }
    #downloadBtn {
      display: none; margin-top: 12px; padding: 12px 18px; border-radius: 12px;
      background: #38bdf8; color: #0f172a; font-weight: 800; text-decoration: none;
      font-size: 0.95rem; text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Cartoon Video Generator</h1>
    <p class="sub">Je line bole te j video ma dekhashe, ane story mujab voice tone (Emotional, Gusso, Deep) badlashe.</p>

    <div class="grid-2">
      <div>
        <label for="langOption">1. Language</label>
        <select id="langOption" onchange="updateVoiceInfo()">
          <option value="hi-IN" selected>Hindi (हिन्दी)</option>
          <option value="gu-IN">Gujarati (ગુજરાતી)</option>
        </select>
      </div>

      <div>
        <label for="voiceGender">2. Voice</label>
        <select id="voiceGender" onchange="updateVoiceInfo()">
          <option value="female" selected>Female Voice</option>
          <option value="male">Male Voice</option>
        </select>
      </div>
    </div>

    <div>
      <label for="moodOption">Voice & Scene Mood</label>
      <select id="moodOption" onchange="updateVoiceInfo()">
        <option value="auto" selected>Auto (Story mujab)</option>
        <option value="emotional">Emotional (ભાવુક)</option>
        <option value="angry">Gusso (ગુસ્સો / તીવ્ર)</option>
        <option value="deep">Deep & Calm (ગંભીર / શાંત)</option>
      </select>
    </div>

    <label for="storyText">Story / Text</label>
    <textarea id="storyText" placeholder="અહીં તમારી વાર્તા લખો (Hindi અથવા Gujarati માં)..."></textarea>

    <button class="btn-gen" id="genVideoBtn" onclick="generateCartoonVideo()">3. Generate Video</button>
    <button class="btn-stop" onclick="stopCartoonVideo()">Stop / Reset</button>

    <div class="info-box" id="voiceInfo">Voice check thai rahyu che...</div>

    <div class="stage-wrap" id="stageWrap">
      <canvas id="cartoonCanvas" width="720" height="1280"></canvas>
      <a id="downloadBtn" download="cartoon-story.webm">⬇ Download Video</a>
    </div>
  </div>

  <script>
    let isSpeaking = false;
    let isRecording = false;
    let mediaRecorder = null;
    let chunks = [];
    let animFrame = null;
    let linesQueue = [];
    let activeLineIdx = 0;
    let activeLineText = "";
    let activeMood = "neutral";

    function detectMoodFromLine(line, gender) {
      const manual = document.getElementById("moodOption").value;
      if (manual !== "auto") return manual;

      const t = line.toLowerCase();
      const angryWords = ["गुस्सा", "गुस्से", "चिल्ला", "नफरत", "बकवास", "gusso", "gusse", "krodh", "chilla", "!"];
      const emotionalWords = ["प्यार", "त्याग", "बीमार", "आंसू", "रोने", "दिल", "माता", "पिता", "प्रेम", "pyar", "tyag", "bimar", "ansu", "dil", "prem"];

      if (angryWords.some(w => t.includes(w))) return "angry";
      if (emotionalWords.some(w => t.includes(w))) return "emotional";
      if (gender === "male") return "deep";
      return "neutral";
    }

    function getToneParams(mood, gender) {
      const basePitch = gender === "male" ? 0.82 : 1.15;
      if (mood === "angry") {
        return { pitch: Math.min(1.4, basePitch + 0.14), rate: 1.12 };
      }
      if (mood === "emotional") {
        return { pitch: Math.max(0.68, basePitch - 0.08), rate: 0.88 };
      }
      if (mood === "deep") {
        return { pitch: Math.max(0.58, basePitch - 0.22), rate: 0.90 };
      }
      return { pitch: basePitch, rate: 0.98 };
    }

    function pickBestVoice(langCode, gender) {
      if (!("speechSynthesis" in window)) return null;
      const voices = window.speechSynthesis.getVoices() || [];
      const prefix = langCode.split("-")[0].toLowerCase();
      const langVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(prefix));
      const pool = langVoices.length ? langVoices : voices;
      if (!pool.length) return null;

      const femaleHints = ["female", "woman", "girl", "heera", "swara", "lekha", "priya", "neerja", "aditi", "google हिन्दी", "google ગુજરાતી"];
      const maleHints = ["male", "man", "boy", "ravi", "prabhat", "hemant", "rahul", "arjun", "aarav"];

      const hints = gender === "male" ? maleHints : femaleHints;
      const matched = pool.find(v => hints.some(h => v.name.toLowerCase().includes(h)));
      if (matched) return matched;

      if (gender === "male" && pool.length > 1) return pool[1];
      return pool[0];
    }

    function updateVoiceInfo() {
      const lang = document.getElementById("langOption").value;
      const gender = document.getElementById("voiceGender").value;
      const moodSel = document.getElementById("moodOption").value;
      const v = pickBestVoice(lang, gender);
      const info = document.getElementById("voiceInfo");
      const vName = v ? `${v.name} (${v.lang})` : "Default System Voice";
      info.textContent = `Voice: ${vName} | Mode: ${moodSel.toUpperCase()} | Line-by-line sync ON`;
    }

    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = updateVoiceInfo;
    }
    updateVoiceInfo();

    function splitIntoLines(rawText) {
      const sentences = rawText
        .split(/(?<=[.!?।])\s+|\n+/)
        .map(s => s.trim())
        .filter(Boolean);

      const finalLines = [];
      for (const s of sentences) {
        if (s.length <= 95) {
          finalLines.push(s);
        } else {
          const words = s.split(/\s+/);
          let cur = "";
          for (const w of words) {
            const test = cur ? cur + " " + w : w;
            if (test.length > 90 && cur) {
              finalLines.push(cur);
              cur = w;
            } else {
              cur = test;
            }
          }
          if (cur) finalLines.push(cur);
        }
      }
      return finalLines.length ? finalLines : [rawText.trim()];
    }

    function wrapLines(ctx, text, maxWidth) {
      const words = text.trim().split(/\s+/).filter(Boolean);
      const lines = [];
      let cur = "";
      for (const w of words) {
        const test = cur ? cur + " " + w : w;
        if (ctx.measureText(test).width > maxWidth && cur) {
          lines.push(cur);
          cur = w;
        } else {
          cur = test;
        }
      }
      if (cur) lines.push(cur);
      return lines.slice(0, 5);
    }

    function drawCartoonScene(t) {
      const canvas = document.getElementById("cartoonCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const w = canvas.width;
      const h = canvas.height;
      const gender = document.getElementById("voiceGender").value;

      let topBg = "#1e3a8a";
      let borderAccent = "#38bdf8";
      if (activeMood === "angry") {
        topBg = "#7f1d1d";
        borderAccent = "#f87171";
      } else if (activeMood === "emotional") {
        topBg = "#312e81";
        borderAccent = "#c084fc";
      } else if (activeMood === "deep") {
        topBg = "#0f172a";
        borderAccent = "#22c55e";
      }

      const sky = ctx.createLinearGradient(0, 0, 0, h);
      sky.addColorStop(0, topBg);
      sky.addColorStop(0.64, "#0f172a");
      sky.addColorStop(0.64, "#1e293b");
      sky.addColorStop(1, "#090d16");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);

      const shakeX = activeMood === "angry" && isSpeaking ? Math.sin(t / 35) * 6 : 0;
      const bob = isSpeaking ? Math.sin(t / 120) * 10 : Math.sin(t / 450) * 4;
      const armWave = isSpeaking ? Math.sin(t / 140) * 0.35 : Math.sin(t / 500) * 0.08;
      const cx = w / 2 + shakeX;
      const cy = 430 + bob;

      // Torso
      ctx.fillStyle = gender === "male" ? "#0284c7" : "#ec4899";
      ctx.beginPath();
      ctx.roundRect(cx - 95, cy + 85, 190, 190, 45);
      ctx.fill();

      // Arms
      ctx.save();
      ctx.translate(cx - 95, cy + 115);
      ctx.rotate(-0.5 + armWave);
      ctx.fillStyle = "#fdba74";
      ctx.beginPath();
      ctx.roundRect(-24, 0, 46, 130, 22);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.translate(cx + 95, cy + 115);
      ctx.rotate(0.4 - armWave);
      ctx.fillStyle = "#fdba74";
      ctx.beginPath();
      ctx.roundRect(-22, 0, 46, 130, 22);
      ctx.fill();
      ctx.restore();

      // Head
      ctx.fillStyle = "#fed7aa";
      ctx.beginPath();
      ctx.arc(cx, cy, 105, 0, Math.PI * 2);
      ctx.fill();

      // Hair
      ctx.fillStyle = "#1e1b4b";
      ctx.beginPath();
      ctx.arc(cx, cy - 18, 108, Math.PI * 1.05, Math.PI * 1.95);
      ctx.fill();
      if (gender === "female") {
        ctx.beginPath();
        ctx.roundRect(cx - 110, cy - 20, 36, 130, 18);
        ctx.roundRect(cx + 74, cy - 20, 36, 130, 18);
        ctx.fill();
      }

      // Eyebrows based on mood
      ctx.strokeStyle = "#1e1b4b";
      ctx.lineWidth = 7;
      ctx.lineCap = "round";
      if (activeMood === "angry") {
        ctx.beginPath();
        ctx.moveTo(cx - 56, cy - 34);
        ctx.lineTo(cx - 22, cy - 20);
        ctx.moveTo(cx + 56, cy - 34);
        ctx.lineTo(cx + 22, cy - 20);
        ctx.stroke();
      } else if (activeMood === "emotional") {
        ctx.beginPath();
        ctx.moveTo(cx - 56, cy - 24);
        ctx.lineTo(cx - 22, cy - 34);
        ctx.moveTo(cx + 56, cy - 24);
        ctx.lineTo(cx + 22, cy - 34);
        ctx.stroke();
      }

      // Eyes
      const isBlinking = Math.sin(t / 900) > 0.96;
      ctx.fillStyle = "#0f172a";
      if (isBlinking) {
        ctx.fillRect(cx - 52, cy - 12, 26, 5);
        ctx.fillRect(cx + 26, cy - 12, 26, 5);
      } else {
        ctx.beginPath();
        ctx.arc(cx - 38, cy - 12, 13, 0, Math.PI * 2);
        ctx.arc(cx + 38, cy - 12, 13, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(cx - 42, cy - 16, 5, 0, Math.PI * 2);
        ctx.arc(cx + 34, cy - 16, 5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Mouth
      const mouthOpen = isSpeaking ? 8 + Math.abs(Math.sin(t / 95)) * 22 : 6;
      ctx.fillStyle = "#991b1b";
      ctx.beginPath();
      ctx.ellipse(cx, cy + 42, 24, mouthOpen, 0, 0, Math.PI * 2);
      ctx.fill();

      // Active line caption box (only currently speaking line)
      ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
      ctx.beginPath();
      ctx.roundRect(40, 770, w - 80, 410, 28);
      ctx.fill();

      ctx.strokeStyle = borderAccent;
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = borderAccent;
      ctx.font = "bold 24px system-ui, sans-serif";
      ctx.textAlign = "center";
      const total = linesQueue.length || 1;
      const lineBadge = isSpeaking ? `LINE ${activeLineIdx + 1} / ${total} • ${activeMood.toUpperCase()}` : "READY";
      ctx.fillText(lineBadge, w / 2, 820);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 38px system-ui, sans-serif";
      const textToDraw = activeLineText || "";
      const lines = wrapLines(ctx, textToDraw, w - 130);
      const startY = 890;
      lines.forEach((line, idx) => {
        ctx.fillText(line, w / 2, startY + idx * 54);
      });
    }

    function startRenderLoop() {
      if (animFrame) cancelAnimationFrame(animFrame);
      const step = (t) => {
        drawCartoonScene(t);
        animFrame = requestAnimationFrame(step);
      };
      animFrame = requestAnimationFrame(step);
    }

    function stopCartoonVideo() {
      isSpeaking = false;
      isRecording = false;
      activeLineText = "";
      activeMood = "neutral";
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
      }
      document.getElementById("genVideoBtn").textContent = "3. Generate Video";
      drawCartoonScene(performance.now());
    }

    function speakLineAt(index) {
      if (!isRecording && !isSpeaking) return;
      if (index >= linesQueue.length) {
        isSpeaking = false;
        activeLineText = "";
        setTimeout(() => {
          if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
          }
          stopCartoonVideo();
        }, 500);
        return;
      }

      activeLineIdx = index;
      activeLineText = linesQueue[index];

      const lang = document.getElementById("langOption").value;
      const gender = document.getElementById("voiceGender").value;
      activeMood = detectMoodFromLine(activeLineText, gender);
      const tone = getToneParams(activeMood, gender);

      if (!("speechSynthesis" in window)) {
        isSpeaking = true;
        setTimeout(() => speakLineAt(index + 1), 2400);
        return;
      }

      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(activeLineText);
      utter.lang = lang;
      utter.pitch = tone.pitch;
      utter.rate = tone.rate;

      const chosenVoice = pickBestVoice(lang, gender);
      if (chosenVoice) utter.voice = chosenVoice;

      isSpeaking = true;
      utter.onend = () => {
        if (!isRecording && !isSpeaking) return;
        speakLineAt(index + 1);
      };
      utter.onerror = () => {
        if (!isRecording && !isSpeaking) return;
        speakLineAt(index + 1);
      };

      window.speechSynthesis.speak(utter);
    }

    function generateCartoonVideo() {
      const raw = document.getElementById("storyText").value.trim();
      if (!raw) {
        alert("કૃપા કરીને પહેલા Story / Text લખો.");
        return;
      }

      stopCartoonVideo();
      linesQueue = splitIntoLines(raw);
      activeLineIdx = 0;
      activeLineText = linesQueue[0];
      const gender = document.getElementById("voiceGender").value;
      activeMood = detectMoodFromLine(activeLineText, gender);

      document.getElementById("stageWrap").style.display = "flex";
      document.getElementById("downloadBtn").style.display = "none";
      startRenderLoop();

      const canvas = document.getElementById("cartoonCanvas");
      const canRecord = Boolean(canvas.captureStream && typeof MediaRecorder !== "undefined");

      if (canRecord) {
        chunks = [];
        const stream = canvas.captureStream(30);
        const types = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm", "video/mp4"];
        const mime = types.find(m => MediaRecorder.isTypeSupported(m)) || "";

        try {
          mediaRecorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
          mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) chunks.push(e.data);
          };
          mediaRecorder.onstop = () => {
            isRecording = false;
            isSpeaking = false;
            activeLineText = "";
            document.getElementById("genVideoBtn").textContent = "3. Generate Video";
            if (!chunks.length) return;
            const blob = new Blob(chunks, { type: mime || "video/webm" });
            const url = URL.createObjectURL(blob);
            const dl = document.getElementById("downloadBtn");
            dl.href = url;
            dl.download = mime.includes("mp4") ? "cartoon-story.mp4" : "cartoon-story.webm";
            dl.style.display = "inline-block";
          };
          mediaRecorder.start();
          isRecording = true;
          document.getElementById("genVideoBtn").textContent = "Recording... (Tap Stop)";
        } catch (err) {
          isRecording = false;
        }
      }

      isSpeaking = true;
      speakLineAt(0);
    }
  </script>
</body>
</html>
